<!doctype html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Form Peminjaman Buku</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main>
		<header class="page-heading">
			<p class="eyebrow"><span aria-hidden="true"></span> Perpustakaan SMA PGRI KASIYAN</p>
			<h1>Peminjaman <em>buku</em></h1>
		</header>
		<form class="loan-form" action="https://script.google.com/macros/s/AKfycbxyia75cWRmmiPfkpq1ZhBCT1mHTsKA2rkFyZJfJY7qeMLiT1PWo611ElaAvXqKYOfpAw/exec" method="post">
			<div class="form-grid">
				<div class="field">
					<label for="nama">Nama Lengkap</label>
					<input id="nama" name="nama" type="text" autocomplete="name" placeholder="Masukkan nama lengkap kalian" required>
				</div>
				<div class="field">
					<label for="kelas">Kelas</label>
					<select id="kelas" name="kelas" required>
						<option value="">--Pilih kelas--</option>
						<option value="X IPA">X IPA</option>
						<option value="X IPS">X IPS</option>
						<option value="XI IPA">XI IPA</option>
						<option value="XI IPS">XI IPS</option>
						<option value="XII IPA">XII IPA</option>
						<option value="XII IPS">XII IPS</option>
					</select>
				</div>
				<div class="field">
					<label for="whatsapp">Nomor WhatsApp</label>
					<input id="whatsapp" name="whatsapp" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Maksimal 10 digit" pattern="[0-9]{1,10}" maxlength="10" title="Masukkan angka saja, maksimal 10 digit" required>
				</div>
				<div class="field">
					<label for="judul-buku">Judul Buku</label>
					<input id="judul-buku" name="judul_buku" type="text" placeholder="judul buku yang dipinjam" required>
				</div>
				<div class="field field-duration">
					<label for="lama-meminjam">Lama Meminjam Buku <span>(hari)</span></label>
					<input id="lama-meminjam" name="lama_meminjam" type="number" min="1" step="1" placeholder="Contoh: 7" required>
				</div>
				<div class="form-actions">
					<button type="submit">Kirim Form <span aria-hidden="true">&rarr;</span></button>
				</div>
			</div>
		</form>
	</main>
</body>
</html>
