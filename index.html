<!doctype html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Form Peminjaman Buku</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main>
		<header class="page-heading">
			<p class="eyebrow">
				<img class="school-logo" src="LOGOSMAPGRI.png" alt="Logo SMA PGRI Kasiyan">
				<span>Perpustakaan SMA PGRI KASIYAN</span>
			</p>
			<h1> Peminjaman <em>Buku</em></h1>
		</header>
		<form id="perpusForm" class="loan-form">
			<div class="form-grid">
				<div class="field">
					<label for="nama">Nama Lengkap</label>
					<input id="nama" name="nama" type="text" autocomplete="name" placeholder="Masukkan nama lengkap kalian" required>
				</div>
				<div class="field">
					<label for="kelas">Kelas</label>
					<select id="kelas" name="kelas" required>
						<option value="">--Pilih kelas--</option>
						<option value="X IPA">X IPA</option>
						<option value="X IPS">X IPS</option>
						<option value="XI IPA">XI IPA</option>
						<option value="XI IPS">XI IPS</option>
						<option value="XII IPA">XII IPA</option>
						<option value="XII IPS">XII IPS</option>
					</select>
				</div>
				<div class="field">
					<label for="whatsapp">Nomor WhatsApp</label>
					<input id="whatsapp" name="whatsapp" type="text" inputmode="numeric" autocomplete="tel" placeholder="Maksimal 15 digit" pattern="[0-9]{1,15}" maxlength="15" title="Masukkan angka saja, maksimal 15 digit" required>
				</div>
				<div class="field">
					<label for="judul-buku">Judul Buku</label>
					<input id="judul-buku" name="judul_buku" type="text" placeholder="judul buku yang dipinjam" required>
				</div>
				<div class="field field-duration">
					<label for="lama-meminjam">Lama Meminjam Buku <span>(hari)</span></label>
					<input id="lama-meminjam" name="lama_meminjam" type="text" inputmode="numeric" pattern="[1-9][0-9]?" maxlength="2" placeholder="Contoh: 7" title="Masukkan jumlah hari dengan angka bulat dari 1 sampai 99" required>
				</div>
				<div class="form-actions">
					<button type="submit">Kirim Form <span aria-hidden="true">&rarr;</span></button>
				</div>
			</div>
		</form>
		<section id="successCard" class="success-card" aria-live="polite" tabindex="-1" hidden>
			<div class="success-icon" aria-hidden="true">🎉</div>
			<h2>Formulir Terkirim!</h2>
			<p>Pengiriman selesai. Jika data belum muncul di Sheet, hubungi petugas perpustakaan.</p>
			<button type="button" id="backBtn">Kembali ke Form</button>
		</section>
		<p id="submitError" class="submit-error" role="alert" hidden>
			Terjadi kesalahan saat mengirim. Periksa koneksi internet lalu coba lagi.
		</p>
	</main>
	<script>
		const scriptURL = "https://script.google.com/macros/s/AKfycbyym-WvY93nk1QHeTlZZQ-1aK48CH1BMltTLlIIgLwmbaoDsfnE-YWG34KpkZjTY1X-/exec";
		const form = document.getElementById("perpusForm");
		const successCard = document.getElementById("successCard");
		const backBtn = document.getElementById("backBtn");
		const submitError = document.getElementById("submitError");
		const submitButton = form.querySelector('button[type="submit"]');
		const submitButtonMarkup = submitButton.innerHTML;
		const whatsappInput = document.getElementById("whatsapp");
		const durationInput = document.getElementById("lama-meminjam");

		form.addEventListener("submit", async (event) => {
			event.preventDefault();
			submitError.hidden = true;
			submitButton.disabled = true;
			submitButton.textContent = "Mengirim...";

			try {
				await fetch(scriptURL, {
					method: "POST",
					mode: "no-cors",
					body: new URLSearchParams(new FormData(form))
				});
				form.hidden = true;
				successCard.hidden = false;
				successCard.focus();
			} catch {
				submitError.hidden = false;
			} finally {
				submitButton.disabled = false;
				submitButton.innerHTML = submitButtonMarkup;
			}
		});

		backBtn.addEventListener("click", () => {
			form.reset();
			whatsappInput.setCustomValidity("");
			durationInput.setCustomValidity("");
			successCard.hidden = true;
			form.hidden = false;
			form.scrollIntoView({ behavior: "smooth", block: "start" });
		});

		whatsappInput.addEventListener("input", () => {
			whatsappInput.setCustomValidity(
				/^[0-9]{1,15}$/.test(whatsappInput.value)
					? ""
					: "Masukkan angka saja, maksimal 15 digit."
			);
		});

		durationInput.addEventListener("input", () => {
			durationInput.setCustomValidity(
				/^[1-9][0-9]?$/.test(durationInput.value)
					? ""
					: "Masukkan jumlah hari dengan angka bulat dari 1 sampai 99."
			);
		});
	</script>
</body>
</html>
